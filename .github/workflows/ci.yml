name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: easyaudit
          POSTGRES_USER: easyaudit
          POSTGRES_PASSWORD: easyaudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyaudit -d easyaudit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://easyaudit:easyaudit@localhost:5432/easyaudit
      EASYAUDIT_RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python scripts/check_architecture.py
      - run: python scripts/check_openapi.py
      - run: alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend unit/component tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run browser foundation acceptance
        run: npm run test:browser

  browser-acceptance:
    needs: [check, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: easyaudit
          POSTGRES_USER: easyaudit
          POSTGRES_PASSWORD: easyaudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyaudit -d easyaudit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://easyaudit:easyaudit@localhost:5432/easyaudit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install frontend dependencies from lockfile
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upgrade real browser database
        run: alembic upgrade head
      - name: Seed credential-readiness browser user
        run: python web/tests/browser/seed_real_acceptance.py
      - name: Start real FastAPI backend
        run: |
          nohup uvicorn easyaudit_next.main:app --host 127.0.0.1 --port 8000 > /tmp/easyaudit-fastapi.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/easyaudit-fastapi.log
          exit 1
      - name: Install Chromium for real browser acceptance
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run real PostgreSQL + FastAPI browser acceptance
        working-directory: web
        run: npm run test:browser:real
      - name: Print FastAPI log on acceptance failure
        if: failure()
        run: cat /tmp/easyaudit-fastapi.log

  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Production topology smoke test
        run: deploy/smoke.sh

  # Not a required check. Deploys, creates data through the API, backs up, destroys the
  # environment and restores into an empty one; the record carries the measured RTO.
  backup-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Backup and restore drill
        env:
          DRILL_RECORD: ${{ runner.temp }}/restore-drill-record.json
        run: deploy/backup/drill.sh
      - name: Upload drill record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-record
          path: ${{ runner.temp }}/restore-drill-record.json
          if-no-files-found: warn
