name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: easyaudit
          POSTGRES_USER: easyaudit
          POSTGRES_PASSWORD: easyaudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyaudit -d easyaudit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://easyaudit:easyaudit@localhost:5432/easyaudit
      EASYAUDIT_RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python scripts/check_architecture.py
      - run: python scripts/check_openapi.py
      - run: alembic upgrade head
      - run: pytest

  frontend-lock-bootstrap:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Generate deterministic frontend lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock frontend dependencies"
          git push origin HEAD:${{ github.head_ref }}
