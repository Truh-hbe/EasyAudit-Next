services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easyaudit
      POSTGRES_USER: easyaudit
      POSTGRES_PASSWORD: easyaudit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyaudit -d easyaudit"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://easyaudit:easyaudit@db:5432/easyaudit
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
